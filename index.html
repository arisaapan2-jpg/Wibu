<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto Play Video</title>
<style>
  body {
    margin: 0;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    flex-direction: column;
  }
  video {
    max-width: 100%;
    max-height: 90vh;
  }
  .caption {
    color: #fff;
    font-family: Arial, sans-serif;
    text-align: center;
    margin-top: 10px;
    padding: 0 10px;
  }
</style>
</head>
<body>

<video id="myVideo" autoplay muted loop playsinline>
  <source src="GANTI_LINK_VIDEO_KAMU_DISINI.mp4" type="video/mp4">
</video>

<div class="caption">
  tiktokio.com1782218481_jePdVDY63TTDQp7xx7M5.mp4
</div>

<script>
  const video = document.getElementById('myVideo');
  video.addEventListener('ended', function() {
    video.currentTime = 0;
    video.play();
  });
</script>

</body>
    </html>
